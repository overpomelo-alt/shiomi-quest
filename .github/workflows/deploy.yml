# 推到 main 就自動部署：建一次遊戲（dev/build.py），放到兩個地方
#   1. Cloudflare（新網址）：要先在 repo 的 Settings → Secrets and variables → Actions 放 CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID，沒放就跳過
#   2. GitHub Pages（舊網址）：要先在 repo 的 Settings → Pages 把 Source 改成「GitHub Actions」；還沒改之前這一步會失敗但不影響網站（舊網址照舊從 main 最上層的檔案發布）
name: 部署
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  build:
    name: 建遊戲
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 資料檢查
        run: node scripts/check.mjs
      - name: 安裝圖片工具
        run: pip install pillow
      - name: 建遊戲
        run: cd dev && python3 build.py
      - name: 交給 GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dev/web
      - name: 部署到 Cloudflare
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
  pages:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
